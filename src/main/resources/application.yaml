spring:
  application:
    name: weatherdemo

server:
  port: 8082

weather:
  providers:
    # Ordered list: first provider is primary, next providers are fallbacks.
    - name: weatherstack
      url-template: ${WEATHER_PROVIDER_1_URL_TEMPLATE:http://api.weatherstack.com/current?access_key={apiKey}&query={city}}
      api-key: ${WEATHER_PROVIDER_1_API_KEY:}
      mapping:
        temperature: /current/temperature
        wind-speed: /current/wind_speed
    - name: openweathermap
      url-template: ${WEATHER_PROVIDER_2_URL_TEMPLATE:https://api.openweathermap.org/data/2.5/weather?q={city}&units=metric&appid={apiKey}}
      api-key: ${WEATHER_PROVIDER_2_API_KEY:}
      mapping:
        temperature: /main/temp
        wind-speed: /wind/speed