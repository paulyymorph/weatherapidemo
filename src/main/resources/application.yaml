spring:
  application:
    name: weatherdemo

server:
  port: 8082

weather:
  providers:
    # Ordered list: first provider is primary, next providers are fallbacks.
    - name: weatherstack
      url-template: ${WEATHER_PROVIDER_1_URL_TEMPLATE:http://api.weatherstack.com/current?access_key=57801064d41654568bbff1098cd1d7ae&query=%s}
      mapping:
        temperature: /current/temperature
        wind-speed: /current/wind_speed
    - name: openweathermap
      url-template: ${WEATHER_PROVIDER_2_URL_TEMPLATE:https://api.openweathermap.org/data/2.5/weather?q=%s&units=metric&appid=2326504fb9b100bee21400190e4dbe6d}
      mapping:
        temperature: /main/temp
        wind-speed: /wind/speed